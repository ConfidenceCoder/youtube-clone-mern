version: '3.8'

services:
  backend:
    build: 
      context: ./backend      
    ports:
      - "8080:8080"          
    env_file:
      - ./backend/.env        
    networks:
      - mern-network

 
  frontend:
    build: 
      context: ./frontend     
    ports:
      - "5173:5173"           
    env_file:
      - ./frontend/.env      
    depends_on:
      - backend              
    networks:
      - mern-network


networks:
  mern-network:
    driver: bridge